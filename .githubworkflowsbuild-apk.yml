name: Build APK

# Собирает APK автоматически в облаке GitHub при каждом push в main,
# а также вручную — вкладка "Actions" -> "Build APK" -> "Run workflow".
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build APK with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: stable

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: brawl-arena-apk
          path: ${{ steps.buildozer.outputs.filename }}
